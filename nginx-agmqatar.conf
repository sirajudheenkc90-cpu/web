# ============================================================
# AGM | The Cool Consultant — nginx site config
# File:  /etc/nginx/sites-available/agmqatar  (symlink into sites-enabled)
# Web root: /var/www/html   (adjust if yours differs)
#
# This config fixes, in one place:
#   • Cache lifetimes (PageSpeed "Use efficient cache lifetimes")
#   • Gzip compression (cuts HTML/CSS/JS transfer ~70% → faster LCP)
#   • Security headers: HSTS, X-Frame-Options, COOP, X-Content-Type
#   • www / clean-URL canonical mismatch (so live URLs match <link canonical>)
#
# HOW TO APPLY (on the Droplet, as root):
#   1) sudo nano /etc/nginx/sites-available/agmqatar
#   2) Paste this, EDIT the two cert paths + root if needed.
#   3) sudo ln -sf /etc/nginx/sites-available/agmqatar /etc/nginx/sites-enabled/agmqatar
#   4) sudo nginx -t        # test config
#   5) sudo systemctl reload nginx
# ============================================================

# 1) Redirect ALL http + non-www  ->  https://www.agmqatar.com
server {
    listen 80;
    listen [::]:80;
    server_name agmqatar.com www.agmqatar.com;
    return 301 https://www.agmqatar.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agmqatar.com;            # non-www HTTPS -> www
    # --- SSL (Certbot usually fills these in; keep your real paths) ---
    ssl_certificate     /etc/letsencrypt/live/agmqatar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agmqatar.com/privkey.pem;
    return 301 https://www.agmqatar.com$request_uri;
}

# 2) Main site  ->  https://www.agmqatar.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.agmqatar.com;

    root /var/www/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/agmqatar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agmqatar.com/privkey.pem;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ---- Gzip compression ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml font/ttf
               font/otf application/x-font-ttf;

    # ---- Clean URLs: serve /contact as /contact.html ----
    # Redirect any explicit .html request to its clean URL (301), to match canonicals.
    location ~ ^/(.*)\.html$ {
        return 301 https://www.agmqatar.com/$1;
    }

    # Try clean path -> .html file -> directory -> 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ---- Long cache for static assets (immutable) ----
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- Short cache for HTML (so content updates show quickly) ----
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # sitemap / robots
    location = /robots.txt { access_log off; }
    location = /sitemap.xml { access_log off; }
}
